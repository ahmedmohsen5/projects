name: MP02 - Terraform secure CI
on:
    pull_request: 
        branches: 
            - main
    
    workflow_dispatch: 
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: 
    contents: read
    id-token: write
jobs:
    terraform-ci:
        name: terraform validate and plan 
        runs-on: ubuntu-latest
        timeout-minutes: 5
        defaults:
            run:
                working-directory: "MP02 Secure IaC CI/terraform"
        steps:
            - name: checkout the code
              uses: actions/checkout@v7
            - name: setup terraform
              uses: hashicorp/setup-terraform@v4.0.1
              with: 
                terraform_version: 1.15.8
            - name: terraform format check 
              run: terraform fmt -check -recursive

            - name: terraform init
              run: terraform init -input=false -lockfile=readonly
            
            - name: terraform validate
              run: terraform validate -no-color
            
            - name: configure aws cred using oidc
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                role-to-assume: ${{vars.AWS_TERRAFORM_PLAN_ROLE_ARN}}
                aws-region: ${{vars.AWS_REGION}}
            
            - name: verify aws identity
              run: aws sts get-caller-identity 
            
            - name: terraform plan 
              shell: bash
              run: |
                set -o pipefail
                terraform plan -input=false -no-color | tee terraform-plan.txt
            - name: write workflow summary
              shell: bash
              run: |
                PLAN_SUMMARY=$(grep -E '^(Plan:|No changes\.)' terraform-plan.txt | tail -n 1 || true)
                if [ -z "$PLAN_SUMMARY" ] && grep -q '^Changes to Outputs:' terraform-plan.txt; then
                    PLAN_SUMMARY="Output changes detected"
                fi
                if [ -z "$PLAN_SUMMARY" ]; then
                    PLAN_SUMMARY="Plan completed - see workflow logs"
                fi
                {
                    echo "## MP02 Terraform CI"
                    echo ""
                    echo "- Commit: \`${GITHUB_SHA::7}\`"
                    echo "- Ref: \`${GITHUB_REF}\`"
                    echo "- Terraform format: ✅ Passed"
                    echo "- Terraform validate: ✅ Passed"
                    echo "- AWS OIDC identity: ✅ Verified"
                    echo "- Terraform plan: \`${PLAN_SUMMARY}\`"
                    } >> "$GITHUB_STEP_SUMMARY"

        

